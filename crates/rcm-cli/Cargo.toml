[package]
name = "rcm-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "rcmctl"
path = "src/main.rs"

[dependencies]
rcm-core = { workspace = true }
rcm-ipc = { workspace = true }
rcm-platform = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
